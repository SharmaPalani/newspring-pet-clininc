apiVersion: apps/v1
kind: Deployment 
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: azurejenkins.azurecr.io/jenkins_project:21
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: acr-aks


       